<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Trackd</title>
    <meta name="description" content="Trackd. Personal macro tracking, local first, works offline." />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />

    <!-- Matched to the app background, per spec 8. Swapped at runtime for dark. -->
    <meta name="theme-color" content="#F0F0F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Macros" />
    <!--
      `black-translucent`, and what this line actually decides is HOW TALL THE WEB
      VIEW IS. That is the only reason it matters, and establishing it took a detour
      through both settings.

      Measured on an iPhone 17 Pro, standalone, both ways:

        black-translucent   the web view covers the whole 874pt screen. Content
                            painted at y=854 is visible. `env(safe-area-inset-top)`
                            reports a real 62.
        default             the web view is 812 tall. Anything painted below 812 is
                            CLIPPED — that is what sliced the tab bar in half in
                            bfe50e4 — and the 62pt strip at the bottom of the
                            display belongs to iOS, which paints the page's own
                            background into it. No CSS can put anything there.

      So `default` gives up the bottom 62pt of the screen. `black-translucent` keeps
      it, and the status bar is not the price 8b524bb feared: that commit warned the
      style forces white glyphs and would be wrong over the light theme, and on this
      iOS it does not — the light-theme screenshots from the two days it was live
      show dark glyphs, picked against the content underneath.

      What `black-translucent` does cost is agreement about height. The layout
      viewport stays 812 while the web view covers 874, so `bottom: 0` and `100dvh`
      resolve to 874 on a scrollable screen and collapse to 812 on one with nothing
      to scroll. That inconsistency — not this line — is what made the tab bar ride
      up only on days with nothing logged. styles.css handles it by anchoring
      everything to `--screen-h`, which is `100lvh` under this style: measured at 874
      in all three states.

      **The pair is load-bearing.** `black-translucent` without a stable anchor is
      the original bug. `lvh` without `black-translucent` anchors to 874 inside an
      812 web view and clips. Each was shipped alone and each failed. Do not change
      one without the other.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Applied before first paint so an installed dark-mode launch never flashes light.
      try {
        var t = localStorage.getItem('mt:theme') || 'system'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <noscript>Trackd needs JavaScript. All of it runs on your device.</noscript>
  </body>
</html>
